name: Publicar dados do painel

on:
  schedule:
    # Limite ToS (igual Filial/limites_github.py): ≥ 6 h; SEM auto-chain.
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      reprocessar:
        description: "Consultar de novo também os meses fechados"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-dados
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # a primeira carga do financeiro (desde janeiro) é longa; depois os meses fechados vêm do cache
    timeout-minutes: 55
    env:
      TZ: America/Sao_Paulo
      DEFAULT_INICIO: "2026-07-01"
      OMIE_EMPRESA: JCA Matriz
      # tempo máximo de ConsultarPedido a cada execução; o restante fica para as próximas
      PEDIDOS_MAX_SEG: "600"
      # meses fechados (após o dia 1 às 23:59) ficam congelados; domingo revalida; botão manual também
      REPROCESSAR: ${{ inputs.reprocessar }}
      OMIE_MATRIZ_APP_KEY: ${{ secrets.OMIE_MATRIZ_APP_KEY }}
      OMIE_MATRIZ_APP_SECRET: ${{ secrets.OMIE_MATRIZ_APP_SECRET }}
      PAINEL_DATA_KEY: ${{ secrets.PAINEL_DATA_KEY }}
      # cache dos meses fechados do painel financeiro
      FIN_JCA_CACHE_KEY: ${{ secrets.PAINEL_DATA_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install httpx python-dotenv cryptography pandas

      # consumidor_final de cada pedido (ConsultarPedido); sem o cache a Omie bloqueia por excesso de chamadas
      - uses: actions/cache/restore@v4
        with:
          path: backend/data/cache_pedidos_matriz.json
          key: pedidos-${{ github.run_id }}
          restore-keys: pedidos-

      # meses fechados já consultados (cifrados com PAINEL_DATA_KEY)
      - uses: actions/cache/restore@v4
        with:
          path: backend/data/cache_congelado_matriz.enc
          key: congelado-${{ github.run_id }}
          restore-keys: congelado-

      # painel financeiro: meses fechados já consultados (cifrados)
      - uses: actions/cache/restore@v4
        with:
          path: data/cache_meses.enc
          key: financeiro-${{ github.run_id }}
          restore-keys: financeiro-

      - run: python scripts/publicar_dados.py

      - uses: actions/cache/save@v4
        if: always() && hashFiles('backend/data/cache_pedidos_matriz.json') != ''
        with:
          path: backend/data/cache_pedidos_matriz.json
          key: pedidos-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('backend/data/cache_congelado_matriz.enc') != ''
        with:
          path: backend/data/cache_congelado_matriz.enc
          key: congelado-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/cache_meses.enc') != ''
        with:
          path: data/cache_meses.enc
          key: financeiro-${{ github.run_id }}
